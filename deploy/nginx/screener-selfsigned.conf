# Screener behind nginx.
#
# Two variants live here. Pick ONE and symlink it into sites-enabled.
#
#   screener.conf            -> Let's Encrypt, needs a real domain name
#   screener-selfsigned.conf -> self-signed cert on a bare IP (this file)
#
# Self-signed means the browser shows a warning you must click through once. The
# connection is still encrypted, so the login password is not sent in the clear.
# Swap to screener.conf once a domain exists.
#
# Install:
#   sudo cp deploy/nginx/screener-selfsigned.conf /etc/nginx/sites-available/screener
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/screener /etc/nginx/sites-enabled/screener
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Plain HTTP would leak the login password, so nothing is served here.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/screener-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/screener-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # No HSTS with a self-signed certificate: pinning HTTPS for an untrusted cert
    # would make the browser refuse the site outright instead of offering the
    # click-through. The app adds HSTS itself once SCREENER_COOKIE_SECURE=1 and a
    # trusted certificate is in place.

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8643;
        proxy_http_version 1.1;

        # Host must be forwarded or the app's same-origin POST check rejects itself.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Market data is polled; never serve it from a proxy cache.
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
