# Screener behind nginx with TLS.
#
# Install:
#   sudo cp deploy/nginx/screener.conf /etc/nginx/sites-available/screener
#   sudo ln -s /etc/nginx/sites-available/screener /etc/nginx/sites-enabled/screener
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace screener.example.com with your hostname before enabling. Obtain the
# certificate first (e.g. `sudo certbot --nginx -d screener.example.com`), then set
# SCREENER_COOKIE_SECURE=1 on the app and recreate it. Turning that flag on before
# HTTPS actually works makes login loop forever, because the browser will not return
# a Secure cookie over plain HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name screener.example.com;

    # Keep the ACME path reachable, send everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name screener.example.com;

    ssl_certificate     /etc/letsencrypt/live/screener.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screener.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The app also sends HSTS once SCREENER_COOKIE_SECURE=1; harmless if duplicated.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Do not cap the request body at nginx's 1m default silently; the app posts tiny
    # JSON bodies, so a small explicit limit is both safe and clear.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8643;
        proxy_http_version 1.1;

        # X-Forwarded-Proto is what tells the app it is behind TLS; without the Host
        # header the app's same-origin check on POST would reject its own requests.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Market data is polled and must never be served from a proxy cache.
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
